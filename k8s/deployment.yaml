apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-memories-deployment
  namespace: photomemories
spec:
  replicas: 2
  selector:
    matchLabels:
      app: photo-memories
  template:
    metadata:
      labels:
        app: photo-memories
    spec:
      containers:
      - name: photo-memories
        image: solomonak/photo-memories:1.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_ALLOWED_HOSTS
          value: "*"